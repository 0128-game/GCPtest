<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>瞬発力じゃんけんテスト</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 20px; background-color: #f0f0f0; }
        #game-box { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #enemy-hand { font-size: 80px; margin: 15px 0; min-height: 100px; }
        #instruction { font-size: 24px; font-weight: bold; color: #d9534f; min-height: 36px; }
        .btn { font-size: 18px; padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background-color: #0275d8; color: white; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #start-btn { background-color: #5cb85c; font-size: 24px; margin-top: 10px; }
        #result-msg { font-weight: bold; margin-top: 15px; min-height: 24px; }
        
        /* キー設定エリアのスタイル */
        .key-config { background: #eef7ff; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #bce8f1; }
        .key-config input { width: 40px; text-align: center; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        
        .rank-info { font-size: 13px; color: #555; text-align: left; margin-top: 20px; background: #fafafa; padding: 10px; border-radius: 5px; border: 1px solid #ddd; }
        .rank-title { font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="game-box">
    <h1>じゃんけん瞬発力テスト</h1>

    <!-- キー設定（キーコンフィグ） -->
    <div class="key-config" id="key-config-box">
        <b>【操作キーの設定】</b><br>
        ✊ グー: <input type="text" id="key-g" maxlength="1" value="g" onchange="updateKeyGuide()">
        ✌️ チョキ: <input type="text" id="key-c" maxlength="1" value="c" onchange="updateKeyGuide()">
        🖐️ パー: <input type="text" id="key-p" maxlength="1" value="p" onchange="updateKeyGuide()">
    </div>

    <div id="instruction">「スタート」を押してね</div>
    <div id="enemy-hand">✊</div>
    <div id="result-msg"></div>

    <div id="controls" style="display:none;">
        <p>指示に合う手を選べ！</p>
        <button class="btn" id="btn-g" onclick="playerSelect('✊')">✊ グー</button>
        <button class="btn" id="btn-c" onclick="playerSelect('✌️')">✌️ チョキ</button>
        <button class="btn" id="btn-p" onclick="playerSelect('🖐️')">🖐️ パー</button>
    </div>

    <br>
    <button id="start-btn" class="btn" onclick="startGame()">スタート</button>

    <!-- ランクの基準案内 -->
    <div class="rank-info">
        <div class="rank-title">【ランク判定基準（タイム ＆ ミス数）】</div>
        🏆 <b>Sランク</b> : 平均 0.60秒未満 ＆ <b>ノーミス</b><br>
        🥇 <b>Aランク</b> : 平均 0.80秒未満 ＆ ミス1回以内<br>
        🥈 <b>Bランク</b> : 平均 1.00秒未満 ＆ ミス2回以内<br>
        🥉 <b>Cランク</b> : 平均 1.30秒未満 ＆ ミス3回以内<br>
        🐢 <b>Dランク</b> : それ以外（1.30秒以上 または ミス4回以上）<br>
        <small>※待機中に2回フライングするとミスになります</small>
    </div>
</div>

<script>
    const hands = ['✊', '✌️', '🖐️'];
    const conditions = ['勝て！', '負けろ！', 'あいこ！'];
    
    let currentEnemyHand = '';
    let currentCondition = '';
    let startTime = 0;
    let round = 0;
    let totalTime = 0;
    let misses = 0;
    const maxRounds = 5;
    
    let isWaitingForHand = false;
    let canInput = false;
    let earlyPressCount = 0;
    let timerId = null;

    // 設定されたキーを取得
    function getKeys() {
        return {
            g: (document.getElementById('key-g').value || 'g').toLowerCase(),
            c: (document.getElementById('key-c').value || 'c').toLowerCase(),
            p: (document.getElementById('key-p').value || 'p').toLowerCase()
        };
    }

    // ボタンのテキストを設定キーに合わせて更新
    function updateKeyGuide() {
        const keys = getKeys();
        document.getElementById('btn-g').innerText = `✊ グー (${keys.g.toUpperCase()})`;
        document.getElementById('btn-c').innerText = `✌️ チョキ (${keys.c.toUpperCase()})`;
        document.getElementById('btn-p').innerText = `🖐️ パー (${keys.p.toUpperCase()})`;
    }

    // 初回読み込み時にキー表記を反映
    updateKeyGuide();

    // キーボード操作処理
    window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const keys = getKeys();
        let selectedHand = '';

        if (key === keys.g) selectedHand = '✊';
        if (key === keys.c) selectedHand = '✌️';
        if (key === keys.p) selectedHand = '🖐️';

        if (selectedHand) {
            handleInput(selectedHand);
        }
    });

    function playerSelect(playerHand) {
        handleInput(playerHand);
    }

    function handleInput(playerHand) {
        // 合図前にボタンを押した場合（フライング処理）
        if (isWaitingForHand) {
            earlyPressCount++;
            
            if (earlyPressCount === 1) {
                document.getElementById('result-msg').innerText = `フライング注意！（あと1回でミス）`;
                document.getElementById('result-msg').style.color = 'orange';
            } else if (earlyPressCount >= 2) {
                clearTimeout(timerId);
                isWaitingForHand = false;
                misses++;
                
                document.getElementById('result-msg').innerText = `2回フライングでミス！`;
                document.getElementById('result-msg').style.color = 'red';
                setTimeout(nextRound, 1200);
            }
            return;
        }

        if (!canInput) return;
        canInput = false;

        const reactionTime = (performance.now() - startTime) / 1000;
        const correctHand = getCorrectHand(currentEnemyHand, currentCondition);

        totalTime += reactionTime;

        if (playerHand === correctHand) {
            document.getElementById('result-msg').innerText = `正解！ (${reactionTime.toFixed(3)}秒)`;
            document.getElementById('result-msg').style.color = 'green';
        } else {
            misses++;
            document.getElementById('result-msg').innerText = `ミス！ (${reactionTime.toFixed(3)}秒)`;
            document.getElementById('result-msg').style.color = 'red';
        }

        setTimeout(nextRound, 1200);
    }

    function startGame() {
        round = 0;
        totalTime = 0;
        misses = 0;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('key-config-box').style.display = 'none'; // プレイ中は設定非表示
        document.getElementById('controls').style.display = 'block';
        nextRound();
    }

    function nextRound() {
        if (round >= maxRounds) {
            endGame();
            return;
        }
        
        round++;
        canInput = false;
        isWaitingForHand = true;
        earlyPressCount = 0;
        
        document.getElementById('instruction').innerText = `第 ${round} 回戦：じゃんけん...`;
        document.getElementById('enemy-hand').innerText = '❓';
        document.getElementById('result-msg').innerText = '';

        // 1秒〜5秒のランダムな待ち時間
        const randomDelay = Math.floor(Math.random() * 4000) + 1000;

        timerId = setTimeout(() => {
            isWaitingForHand = false;
            currentEnemyHand = hands[Math.floor(Math.random() * hands.length)];
            currentCondition = conditions[Math.floor(Math.random() * conditions.length)];

            document.getElementById('enemy-hand').innerText = currentEnemyHand;
            document.getElementById('instruction').innerText = currentCondition;
            
            startTime = performance.now();
            canInput = true;
        }, randomDelay);
    }

    function getCorrectHand(enemy, condition) {
        if (condition === 'あいこ！') return enemy;

        if (condition === '勝て！') {
            if (enemy === '✊') return '🖐️';
            if (enemy === '✌️') return '✊';
            if (enemy === '🖐️') return '✌️';
        }

        if (condition === '負けろ！') {
            if (enemy === '✊') return '✌️';
            if (enemy === '✌️') return '🖐️';
            if (enemy === '🖐️') return '✊';
        }
    }

    function endGame() {
        canInput = false;
        isWaitingForHand = false;
        document.getElementById('controls').style.display = 'none';
        document.getElementById('key-config-box').style.display = 'block'; // ゲーム終了時に設定を再表示
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('start-btn').innerText = 'もう一度遊ぶ';

        const avgTime = parseFloat((totalTime / maxRounds).toFixed(3));
        
        let rank = '';
        let icon = '';
        
        if (avgTime < 0.60 && misses === 0) {
            rank = 'S';
            icon = '🏆';
        } else if (avgTime < 0.80 && misses <= 1) {
            rank = 'A';
            icon = '🥇';
        } else if (avgTime < 1.00 && misses <= 2) {
            rank = 'B';
            icon = '🥈';
        } else if (avgTime < 1.30 && misses <= 3) {
            rank = 'C';
            icon = '🥉';
        } else {
            rank = 'D';
            icon = '🐢';
        }

        document.getElementById('enemy-hand').innerText = icon;
        document.getElementById('instruction').innerText = `ゲーム終了！ [ランク ${rank}]`;
        document.getElementById('result-msg').style.color = 'black';
        document.getElementById('result-msg').innerHTML = 
            `平均反応速度: <b>${avgTime.toFixed(3)}秒</b><br>ミス回数: ${misses}回`;
    }
</script>

</body>
</html>
